<title>HeatDesk Cockpit BDR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: barra laterale fissa con le viste, area di lavoro a destra; su telefono la barra diventa una fila di schede in alto. */
:root{
  --bg:#fafafa; --surface:#ffffff; --surface-2:#f4f4f5; --fg:#09090b; --muted:#71717a; --faint:#a1a1aa; --line:#e4e4e7;
  --ink:#18181b; --ink-fg:#fafafa;
  --violet:#7d68eb; --violet-2:#6c5ae6; --violet-soft:#f1edff; --violet-ink:#5b47d6;
  --coral:#fc9090; --coral-soft:#fdeeee; --coral-ink:#c23b3b;
  --ok:#10b981; --ok-soft:#e8f8f1; --ok-ink:#047857;
  --warn:#f99c00; --warn-soft:#fff5e0; --warn-ink:#a15c00;
  --shadow:0 1px 2px rgba(24,24,27,.06),0 8px 24px rgba(24,24,27,.06);
  --f-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0c0f; --surface:#151519; --surface-2:#1e1e23; --fg:#f4f4f5; --muted:#a1a1aa; --faint:#71717a; --line:#2a2a31;
  --ink:#f4f4f5; --ink-fg:#18181b;
  --violet:#9f8cf2; --violet-2:#8b78ee; --violet-soft:#241f3a; --violet-ink:#c4b8ff;
  --coral:#fc9090; --coral-soft:#3a1f22; --coral-ink:#ffb4b4;
  --ok:#34d399; --ok-soft:#0f2a22; --ok-ink:#7ee8bf;
  --warn:#fbbf24; --warn-soft:#33260d; --warn-ink:#fcd77a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0c0f; --surface:#151519; --surface-2:#1e1e23; --fg:#f4f4f5; --muted:#a1a1aa; --faint:#71717a; --line:#2a2a31;
  --ink:#f4f4f5; --ink-fg:#18181b;
  --violet:#9f8cf2; --violet-2:#8b78ee; --violet-soft:#241f3a; --violet-ink:#c4b8ff;
  --coral:#fc9090; --coral-soft:#3a1f22; --coral-ink:#ffb4b4;
  --ok:#34d399; --ok-soft:#0f2a22; --ok-ink:#7ee8bf;
  --warn:#fbbf24; --warn-soft:#33260d; --warn-ink:#fcd77a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:28px;font-weight:600}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
a{color:var(--violet-ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px;padding:18px 12px 14px max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#9079ed,#6c5ae6);display:grid;place-items:center;color:#fff;font:700 15px var(--f-display)}
.brand b{display:block;font:600 15px var(--f-display)}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .group{margin:12px 8px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--ink);color:var(--ink-fg)}
.nav a .count{margin-left:auto;font-size:12px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.nav a.on .count{background:rgba(255,255,255,.18);color:inherit}
.nav svg{width:16px;height:16px;flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.demo-tag{font:600 11px var(--f-mono);letter-spacing:.04em;color:var(--violet-ink);background:var(--violet-soft);border-radius:8px;padding:8px 10px;line-height:1.4}
.who{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px}
.avatar{width:30px;height:30px;border-radius:99px;background:var(--surface-2);display:grid;place-items:center;font:600 12px var(--f-display);color:var(--muted);flex:none}
.who b{display:block;font-size:13px}
.who span{font-size:12px;color:var(--muted)}
.theme-btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted)}

main{min-width:0;padding-block:28px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.head .intro{max-width:640px;display:flex;flex-direction:column;gap:8px}
.head .intro p{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn.violet{background:linear-gradient(135deg,#9079ed,#6c5ae6);color:#fff;border:0}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn svg{width:16px;height:16px}

.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.violet{background:var(--violet-soft);color:var(--violet-ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok-ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn-ink)}
.chip.coral{background:var(--coral-soft);color:var(--coral-ink)}
.chip.line{background:transparent;border:1px solid var(--line);color:var(--fg)}
.dot{width:6px;height:6px;border-radius:99px;background:currentColor}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-b{padding:16px 18px}

/* lista aziende */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) 92px 150px 140px 44px;gap:16px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row.headrow{cursor:default;padding-block:10px;background:transparent}
.row.headrow:hover{background:transparent}
.co{display:flex;gap:12px;min-width:0}
.mono{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font:600 13px var(--f-display);flex:none;background:var(--violet-soft);color:var(--violet-ink)}
.co-t{min-width:0;display:flex;flex-direction:column;gap:4px}
.co-t b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co-t .desc{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.sig{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--violet-ink);background:var(--violet-soft);border-radius:6px;padding:2px 8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;align-self:flex-start}
.score{display:flex;align-items:center;gap:8px}
.ring{--p:0;width:34px;height:34px;border-radius:99px;background:conic-gradient(var(--violet) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring i{width:26px;height:26px;border-radius:99px;background:var(--surface);display:grid;place-items:center;font:600 11px var(--f-display);font-style:normal}
.fascia{font:700 12px var(--f-display);width:22px;height:22px;border-radius:6px;display:grid;place-items:center}
.fascia.A{background:var(--ink);color:var(--ink-fg)}
.fascia.B{background:var(--violet-soft);color:var(--violet-ink)}
.fascia.C{background:var(--surface-2);color:var(--muted)}
.place b{display:block;font-weight:500}
.place span{font-size:12px;color:var(--muted)}
.callbtn{width:36px;height:36px;border-radius:99px;border:0;background:var(--ok);color:#fff;display:grid;place-items:center}
.callbtn svg{width:16px;height:16px}
.callbtn:disabled{background:var(--surface-2);color:var(--faint);cursor:default}

.filters{display:flex;gap:6px;flex-wrap:wrap}
.seg{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:500;color:var(--muted)}
.seg.on{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.search{flex:1;min-width:180px;max-width:320px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font:inherit;color:var(--fg)}

/* scheda azienda */
.back{color:var(--muted);text-decoration:none;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.card-h{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.card-h .mono{width:52px;height:52px;font-size:17px;border-radius:12px}
.card-h .t{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px}
.card-h h1{font-size:26px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.facts>div{background:var(--surface);padding:14px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.facts b{font:600 16px var(--f-display)}
.facts span.s{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.why{display:flex;flex-direction:column;gap:10px}
.why li{display:flex;gap:10px;align-items:flex-start}
.why ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tick{width:20px;height:20px;border-radius:6px;background:var(--violet-soft);color:var(--violet-ink);display:grid;place-items:center;flex:none;margin-top:1px}
.tick svg{width:12px;height:12px}
.opener{position:relative;border-radius:14px;padding:18px 18px 16px;background:linear-gradient(135deg,#9079ed,#6c5ae6);color:#fff;display:flex;flex-direction:column;gap:10px}
.opener .label{color:rgba(255,255,255,.8)}
.opener q{font:500 17px/1.45 var(--f-display);quotes:"“" "”"}
.opener .btn{align-self:flex-start;background:rgba(255,255,255,.16);border:0;color:#fff}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--violet)}
.bar.ink i{background:var(--ink)}
.bar.ok i{background:var(--ok)}
.rules{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.rules li{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.rules li.yes{color:var(--fg)}
.rules li span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.copy{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--muted);margin-left:6px}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;padding:10px;resize:vertical}
.warnbox{border-radius:12px;padding:12px 14px;background:var(--warn-soft);color:var(--warn-ink);font-size:13px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:13px}
.timeline li{display:flex;gap:10px}
.timeline time{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* sessione e chiamata */
.session{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--ink-fg);border-radius:12px;padding:10px 14px}
.session .grow{flex:1;min-width:160px}
.session .btn{background:rgba(127,127,127,.18);border:0;color:inherit}
.callbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:10px 12px;width:min(640px,calc(100% - 32px))}
.callbar .grow{flex:1;min-width:150px}
.callbar b{display:block}
.callbar span{font-size:12px;color:var(--muted)}
.pulse{width:8px;height:8px;border-radius:99px;background:var(--warn);animation:p 1s infinite}
.pulse.live{background:var(--ok)}
@keyframes p{50%{opacity:.3}}
.btn.ok{background:var(--ok);color:#fff;border:0}
.btn.coral{background:var(--coral-soft);color:var(--coral-ink);border:0}
.scrim{position:fixed;inset:0;background:rgba(9,9,11,.35);z-index:45}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:50;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px;border-bottom:1px solid var(--line)}
.drawer-b{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.x{border:0;background:var(--surface-2);border-radius:8px;width:30px;height:30px}
.outcomes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.oc{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.oc b{font-size:13px}
.oc span{font-size:12px;color:var(--muted)}
.oc.on{border-color:var(--violet);background:var(--violet-soft)}
.oc.good b{color:var(--ok-ink)}
.oc.bad b{color:var(--coral-ink)}
.days{display:flex;gap:6px;flex-wrap:wrap}

/* misura e metodo */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.kpi b{font:600 28px var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 18px;border-bottom:1px solid var(--line)}
td{padding:11px 18px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.funnel{display:flex;flex-direction:column;gap:10px}
.f-row{display:grid;grid-template-columns:200px minmax(0,1fr) 70px;gap:12px;align-items:center;font-size:13px}
.f-bar{height:22px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.f-bar i{display:block;height:100%;background:var(--faint);border-radius:6px}
.f-row.hl .f-bar i{background:var(--violet)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.step{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.step .n{font:600 12px var(--f-mono);color:var(--violet-ink)}
.step p{font-size:13px;color:var(--muted)}
.step .tool{font-size:12px;font-weight:600;color:var(--fg)}
.sliders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.sl{display:flex;flex-direction:column;gap:10px}
.sl-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 34px;gap:10px;align-items:center;font-size:13px}
.sl-row output{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--violet)}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rank li{display:grid;grid-template-columns:28px minmax(0,1fr) 40px 30px 40px;gap:8px;align-items:center;padding:8px 18px;border-top:1px solid var(--line);font-size:13px}
.rank li:first-child{border-top:0}
.mv.up{color:var(--ok-ink)}
.mv.down{color:var(--coral-ink)}
.note{font-size:12px;color:var(--muted)}
.banner{border-radius:12px;padding:12px 14px;background:var(--violet-soft);color:var(--violet-ink);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px}

@media (max-width:980px){
  .row{grid-template-columns:minmax(0,1fr) 84px 44px}
  .row .place,.row .st{display:none}
  .grid2{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:1fr 1fr}
  .sliders{grid-template-columns:1fr}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand span,.side-foot,.nav .group{display:none}
  .nav{flex-direction:row}
  .nav a{white-space:nowrap;padding:7px 10px}
  .nav a .count{display:none}
  .facts{grid-template-columns:1fr 1fr}
  .steps{grid-template-columns:1fr}
  .f-row{grid-template-columns:110px minmax(0,1fr) 54px}
  .outcomes{grid-template-columns:1fr}
  .kv{grid-template-columns:96px minmax(0,1fr)}
  .sl-row{grid-template-columns:minmax(0,1fr) 90px 30px}
}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">H</div><div><b>Cockpit BDR</b><span>HeatDesk</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="demo-tag">DEMO · 61 aziende reali dal campione del 15/11/2026. Le chiamate sono simulate.</div>
      <div class="who"><div class="avatar">BD</div><div><b>BDR demo</b><span>Nord e Centro</span></div></div>
      <button class="theme-btn" id="themeBtn" type="button">Tema chiaro o scuro</button>
    </div>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>

const KEY = "heatdesk-cockpit-v1";
let S = load();
function load(){
  const base = {esiti:{}, note:{}, pesi:{}, soglie:{...SOGLIE_D}, simulato:false};
  try{ const x = JSON.parse(localStorage.getItem(KEY)||"null"); return x ? {...base, ...x} : base; }catch(e){ return base; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const W = k => (S.pesi[k] ?? REGOLE.find(r=>r.k===k).d);
const WD = k => REGOLE.find(r=>r.k===k).d;

function punteggio(a, w=W){
  const s = a.s;
  const fit = (s.manut ? w("manut") : s.install ? w("install") : 0) + (s.marchi ? w("marchi") : 0)
    + (s.inFascia ? w("dim") : (!s.dimNota ? w("dimIgnota") : 0)) + (s.nordCentro ? w("nord") : 0);
  const mom = w("recente") + (s.ufficio ? w("ufficio") : s.commerciale ? w("commerciale") : 0)
    + (s.piuAssunzioni ? w("piu") : 0) + (s.crescita ? w("crescita") : 0);
  const qual = (s.identita ? w("ident") : 0) + (s.contatto ? w("contatto") : 0) + (s.titolare ? w("titolare") : 0);
  return {fit, mom, qual, tot: fit+mom+qual};
}
function fascia(a, w=W, sog=S.soglie){
  if (a.verdetto==="fuori") return "esclusa";
  if (a.verdetto==="dubbio") return "da verificare";
  const t = punteggio(a,w).tot;
  return t >= sog.A ? "A" : t >= sog.B ? "B" : "C";
}
function maxTot(w=W){
  return Math.max(w("manut"),w("install")) + w("marchi") + Math.max(w("dim"),w("dimIgnota")) + w("nord")
    + w("recente") + Math.max(w("ufficio"),w("commerciale")) + w("piu") + w("crescita")
    + w("ident") + w("contatto") + w("titolare");
}

function stato(id){
  const u = ultimo(id);
  if(!u) return {t:"Da chiamare", c:"line", libero:true};
  const e = ESITI[u.e];
  const scad = u.giorni!=null ? u.t + u.giorni*864e5 : null;
  const libero = scad!=null && scad <= Date.now() && !["demo","sbagliato","non_richiamare"].includes(u.e) && u.giorni < 90;
  let t = e.stato[0];
  if (scad && e.stato[0]==="Da richiamare") t += " · " + new Date(scad).toLocaleDateString("it-IT",{day:"numeric",month:"short"});
  return {t, c:e.stato[1], libero, esito:u.e};
}

/* ---------- code ---------- */
const dentro = () => AZIENDE.filter(a => a.verdetto==="dentro");
function codaOggi(){
  return dentro().filter(a => ["A","B"].includes(fascia(a)) && stato(a.id).libero)
    .sort((x,y) => punteggio(y).tot - punteggio(x).tot);
}

/* ---------- navigazione ---------- */
let SESS = null;      // {coda:[ids], i}
let CALL = null;      // {id, fase, t0}
let vista = "oggi", filtro = {fascia:"tutte", q:""};

function nav(){
  const n = codaOggi().length;
  const items = [
    ["oggi","Lead di oggi",ICON.today,n],
    ["aziende","Tutte le aziende",ICON.list,AZIENDE.length],
    ["misura","Esiti e misura",ICON.chart,null],
    ["g","Come lavora"],
    ["punteggio","Regole di punteggio",ICON.sliders,null],
    ["metodo","Da dove arrivano i lead",ICON.flow,null],
  ];
  $("#nav").innerHTML = items.map(([k,t,ic,c]) => k==="g" ? `<div class="group label">${t}</div>` :
    `<a href="#${k}" class="${vista===k || (vista.startsWith("azienda-") && k===(SESS?"oggi":"aziende")) ? "on":""}">${ic}<span>${t}</span>${c!=null?`<span class="count num">${c}</span>`:""}</a>`).join("");
}

function route(){
  const h = location.hash.replace("#","") || "oggi";
  vista = h;
  nav();
  if (h.startsWith("azienda-")) return vAzienda(h.slice(8));
  ({oggi:vOggi, aziende:vAziende, misura:vMisura, punteggio:vPunteggio, metodo:vMetodo}[h] || vOggi)();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

/* ---------- riga lista ---------- */
function riga(a){
  const p = punteggio(a), f = fascia(a), st = stato(a.id);
  const pct = Math.round(p.tot / maxTot() * 100);
  const sig = a.s.ufficio ? "Cerca ufficio: " + ruolo1(a) : "Cerca: " + ruolo1(a);
  const sc = ["A","B","C"].includes(f) ? `<div class="score"><span class="fascia ${f}">${f}</span><div class="ring" style="--p:${pct}"><i class="num">${p.tot}</i></div></div>`
    : `<span class="chip ${f==="esclusa"?"coral":"warn"}">${f}</span>`;
  return `<div class="row" data-id="${a.id}">
    <div class="co"><div class="mono">${esc(iniziali(nomeBreve(a.nome))||"?")}</div>
      <div class="co-t"><b>${esc(a.nome)}</b><span class="sig">${esc(sig)}${a.nAnnunci>1?` · ${a.nAnnunci} annunci`:""}</span><span class="desc">${esc(a.verdetto==="dentro"?a.testo:a.motivo)}</span></div></div>
    ${sc}
    <div class="place"><b>${esc(a.comune.split(" (")[0])}</b><span>${esc(a.regione)}</span></div>
    <div class="st"><span class="chip ${st.c}">${st.c!=="line"?'<span class="dot"></span>':""}${esc(st.t)}</span></div>
    <button class="callbtn" type="button" data-call="${a.id}" aria-label="Simula chiamata a ${esc(a.nome)}" ${a.tel && a.verdetto==="dentro" ? "" : "disabled"}>${ICON.phone}</button>
  </div>`;
}
function bindRows(root){
  root.querySelectorAll(".row[data-id]").forEach(r => r.addEventListener("click", e => {
    if (e.target.closest("[data-call]")) return;
    location.hash = "azienda-" + r.dataset.id;
  }));
  root.querySelectorAll("[data-call]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); chiama(b.dataset.call); }));
}
const headRow = `<div class="row headrow label"><div>Azienda e segnale</div><div>Punteggio</div><div class="place">Dove</div><div class="st">Stato</div><div></div></div>`;

/* ---------- vista: lead di oggi ---------- */
function vOggi(){
  const coda = codaOggi();
  const d = dentro();
  const fA = coda.filter(a=>fascia(a)==="A").length, fB = coda.length - fA;
  const richiami = d.filter(a => { const u=ultimo(a.id); return u && stato(a.id).libero; }).length;
  const demo = d.filter(a => ultimo(a.id)?.e==="demo").length;
  const data = new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
  $("#view").innerHTML = `
    ${sessBar()}
    <div class="head">
      <div class="intro"><span class="label">${esc(data)}</span><h1>Lead di oggi</h1>
        <p>Installatori e manutentori che hanno pubblicato un annuncio per tecnici negli ultimi 14 giorni, ordinati per punteggio. Si chiama il titolare, con la frase di apertura scritta sulla scheda.</p></div>
      <button class="btn violet" type="button" id="startSess" ${coda.length?"":"disabled"}>${ICON.phone} Inizia la sessione di chiamate</button>
    </div>
    <div class="chips">
      <span class="chip line num"><b>${coda.length}</b>&nbsp;da chiamare</span>
      <span class="chip violet num">${fA} in fascia A · ${fB} in fascia B</span>
      ${richiami?`<span class="chip warn num">${richiami} richiami in scadenza</span>`:""}
      ${demo?`<span class="chip ok num">${demo} demo fissate</span>`:""}
      <span class="note">Ogni lunedì arrivano i nuovi annunci della settimana. La stessa azienda rientra solo dopo 90 giorni.</span>
    </div>
    <div class="panel">${coda.length ? `<div class="rows">${headRow}${coda.map(riga).join("")}</div>` :
      `<div class="empty"><h3>Lista di oggi finita</h3><p>Hai chiamato tutte le aziende di fascia A e B. Le fasce C sono in Tutte le aziende.</p><a class="btn" href="#aziende">Apri tutte le aziende</a></div>`}</div>`;
  bindRows($("#view"));
  $("#startSess")?.addEventListener("click", () => { SESS = {coda: coda.map(a=>a.id), i:0}; location.hash = "azienda-" + SESS.coda[0]; });
  bindSess();
}

/* ---------- vista: tutte le aziende ---------- */
function vAziende(){
  const ord = {A:0,B:1,C:2,"da verificare":3,"esclusa":4};
  const fasce = ["tutte","A","B","C","da verificare","esclusa"];
  const lista = AZIENDE.filter(a => filtro.fascia==="tutte" || fascia(a)===filtro.fascia)
    .filter(a => !filtro.q || (a.nome+" "+a.comune+" "+a.regione+" "+a.testo).toLowerCase().includes(filtro.q.toLowerCase()))
    .sort((x,y) => (ord[fascia(x)]-ord[fascia(y)]) || (punteggio(y).tot-punteggio(x).tot));
  const cnt = f => AZIENDE.filter(a => f==="tutte" || fascia(a)===f).length;
  $("#view").innerHTML = `
    ${sessBar()}
    <div class="head"><div class="intro"><h1>Tutte le aziende</h1>
      <p>Il campione completo: 61 aziende reali con un annuncio per tecnici su Indeed. Solo quelle nel cliente ideale ricevono fascia e punteggio; le altre restano visibili con il motivo.</p></div></div>
    <div class="panel">
      <div class="panel-h"><div class="filters">${fasce.map(f=>`<button type="button" class="seg ${filtro.fascia===f?"on":""}" data-f="${f}">${f==="tutte"?"Tutte":f.length===1?"Fascia "+f:f[0].toUpperCase()+f.slice(1)} <span class="num muted">${cnt(f)}</span></button>`).join("")}</div>
        <input class="search" id="q" type="search" placeholder="Cerca per nome, comune, attività" value="${esc(filtro.q)}"></div>
      <div class="rows">${headRow}${lista.map(riga).join("") || `<div class="empty">Nessuna azienda con questi filtri.</div>`}</div>
    </div>`;
  $("#view").querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => { filtro.fascia=b.dataset.f; vAziende(); }));
  const q = $("#q"); q.addEventListener("input", () => { filtro.q=q.value; const pos=q.selectionStart; vAziende(); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos); });
  bindRows($("#view")); bindSess();
}

/* ---------- vista: scheda azienda ---------- */

  const a = AZIENDE.find(x => x.id===id);
  if (!a) { location.hash="aziende"; return; }
  const p = punteggio(a), f = fascia(a), st = stato(a.id), s = a.s;
  const fitMax = Math.max(W("manut"),W("install"))+W("marchi")+Math.max(W("dim"),W("dimIgnota"))+W("nord");
  const momMax = W("recente")+Math.max(W("ufficio"),W("commerciale"))+W("piu")+W("crescita");

  const why = [
    `Annuncio aperto su Indeed negli ultimi 14 giorni: cerca <b>${esc(a.ruolo)}</b>${a.nAnnunci>1?` (${a.nAnnunci} annunci)`:""}.`,

    s.piuAssunzioni ? "Sta facendo più assunzioni insieme." : "",

  const dim = [a.dipendenti?`${a.dipendenti} addetti`:"", a.fatturato?`${euro(a.fatturato)}${a.annoFatt?` (${a.annoFatt})`:""}`:""].filter(Boolean).join(" · ");

    <div class="panel">
      <div class="panel-b card-h">
        <div class="mono">${esc(iniziali(nomeBreve(a.nome))||"?")}</div>
        <div class="t"><h1>${esc(a.nome)}</h1>
          <div class="chips">
            ${["A","B","C"].includes(f)?`<span class="chip violet num">Fascia ${f} · ${p.tot} punti</span>`:`<span class="chip warn">${esc(f)}</span>`}
            <span class="chip ${st.c}">${esc(st.t)}</span>
            ${a.piva?`<span class="chip line num">P.IVA ${esc(a.piva)}${a.vies?" · confermata su VIES":""}</span>`:""}
            <a class="chip line" href="${esc(a.link)}" target="_blank" rel="noopener">Annuncio su Indeed ↗</a>
            ${a.sito?`<a class="chip line" href="${esc(/^https?:/.test(a.sito)?a.sito:"https://"+a.sito)}" target="_blank" rel="noopener">Sito ↗</a>`:""}
          </div></div>
        <button class="btn ok" type="button" data-call="${a.id}" ${a.tel && a.verdetto==="dentro"?"":"disabled"}>${ICON.phone} Simula chiamata al titolare</button>
      </div>
      <div class="facts">
        <div><span class="label">Chi chiamare</span><b>${esc(a.titolare || "Il titolare")}</b><span class="s">${a.titolare?"":"nome non trovato con fonti gratuite"}</span></div>
        <div><span class="label">Telefono</span><b class="num">${esc(a.tel || "non trovato")}</b><span class="s">${a.tel?`<button class="copy" type="button" data-copy="${esc(a.tel)}">Copia</button>`:"cerca sul sito"}</span></div>

      </div>
      <div class="stack">
        <div class="panel"><div class="panel-h"><h2>Punteggio</h2><a class="note" href="#punteggio">Cambia i pesi</a></div>

            <div><div class="bar-l"><span>Momento e bisogno</span><span class="num">${p.mom} / ${momMax}</span></div><div class="bar"><i style="width:${p.mom/momMax*100}%"></i></div>
              <ul class="rules">${rl(true,"Annuncio negli ultimi 14 giorni",W("recente"))}${rl(s.ufficio,"Ufficio o coordinamento",W("ufficio"))}${s.commerciale?rl(true,"Cerca un commerciale",W("commerciale")):""}${rl(s.piuAssunzioni,"Più assunzioni",W("piu"))}${rl(s.crescita,"Frase di crescita",W("crescita"))}</ul></div>

          </div></div>
        <div class="panel"><div class="panel-h"><h2>Dati e fonti</h2></div>
          <div class="panel-b"><dl class="kv">
            <dt>Ragione sociale</dt><dd>${esc(a.ragione || a.nome)}</dd>
            ${a.vies?`<dt>Indirizzo (VIES)</dt><dd>${esc(a.vies)}</dd>`:""}
            <dt>Email</dt><dd>${esc(a.email || "non trovata")}</dd>
            <dt>Sito</dt><dd>${esc(a.sito || "non trovato")}</dd>
            <dt>Fonti</dt><dd class="note">${esc(a.fonti || "annuncio Indeed")}</dd>
          </dl><p class="note" style="margin-top:12px">Solo contatti aziendali. I numeri personali scritti negli annunci sono per i candidati e non si usano.</p></div></div>
      </div>
    </div>`;
  $("#nota").addEventListener("input", e => { S.note[a.id] = e.target.value; save(); });
  $("#view").querySelectorAll("[data-call]").forEach(b => b.addEventListener("click", () => chiama(b.dataset.call)));
  bindCopy($("#view")); bindSess();
}

function bindCopy(root){
  root.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
    const t = b.dataset.copy, old = b.textContent;
    try { await navigator.clipboard.writeText(t); b.textContent = "Copiato"; }
    catch(e){ const r=document.createRange(); r.selectNodeContents(b.closest(".opener")?.querySelector("q") || b.parentElement); const s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent="Selezionato"; }
    setTimeout(() => b.textContent = old, 1400);
  }));
}

/* ---------- sessione ---------- */
function sessBar(id){
  if (!SESS) return "";
  const i = id ? SESS.coda.indexOf(id) : SESS.i;
  const a = AZIENDE.find(x => x.id===SESS.coda[Math.max(i,0)]);
  return `<div class="session"><span class="label" style="color:inherit;opacity:.7">Sessione</span>
    <span class="grow num">${Math.max(i,0)+1} di ${SESS.coda.length} · ${esc(a?.nome||"")}</span>
    <button class="btn small" type="button" id="sessNext">Prossima azienda ${ICON.arrow}</button>
    <button class="btn small" type="button" id="sessEnd">Chiudi sessione</button></div>`;
}
function bindSess(){
  $("#sessNext")?.addEventListener("click", prossima);
  $("#sessEnd")?.addEventListener("click", () => { SESS=null; route(); });
}
function prossima(){
  if (!SESS) return;
  const cur = location.hash.startsWith("#azienda-") ? SESS.coda.indexOf(location.hash.slice(9)) : SESS.i;
  SESS.i = cur + 1;
  if (SESS.i >= SESS.coda.length) { SESS = null; location.hash = "oggi"; route(); return; }
  location.hash = "azienda-" + SESS.coda[SESS.i];
}

/* ---------- chiamata simulata ---------- */
let timer = null;
function chiama(id){
  const a = AZIENDE.find(x => x.id===id); if (!a || !a.tel) return;
  CALL = {id, fase:"squilla", t0:Date.now()};
  if (!location.hash.endsWith("azienda-"+id)) location.hash = "azienda-" + id;
  disegnaCall();
  clearInterval(timer); timer = setInterval(() => { const el=$("#ctime"); if(el) el.textContent = durata(); }, 500);
}
const durata = () => { const s=Math.floor((Date.now()-CALL.t0)/1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; };
function disegnaCall(){
  const ov = $("#overlay");
  if (!CALL) { ov.innerHTML=""; clearInterval(timer); return; }
  const a = AZIENDE.find(x => x.id===CALL.id);
  if (CALL.fase==="squilla" || CALL.fase==="parla") {
    const live = CALL.fase==="parla";
    ov.innerHTML = `<div class="callbar" role="dialog" aria-label="Chiamata simulata">
      <span class="pulse ${live?"live":""}"></span>
      <div class="grow"><b>${esc(a.titolare || "Titolare")} · ${esc(nomeBreve(a.nome))}</b><span class="num">${esc(a.tel)} · ${live?"in linea":"squilla"} <span id="ctime">${durata()}</span> · simulata</span></div>
      ${live ? `<button class="btn coral small" type="button" id="hang">Riaggancia</button>`
             : `<button class="btn ok small" type="button" id="ans">Risponde</button><button class="btn small" type="button" id="noans">Non risponde</button>`}
    </div>`;
    $("#ans")?.addEventListener("click", () => { CALL.fase="parla"; CALL.t0=Date.now(); disegnaCall(); });
    $("#noans")?.addEventListener("click", () => { CALL.fase="esito"; CALL.sel="no_risposta"; disegnaCall(); });
    $("#hang")?.addEventListener("click", () => { CALL.fase="esito"; disegnaCall(); });
    return;
  }
  clearInterval(timer);
  const sel = CALL.sel, gg = CALL.giorni ?? (sel ? ESITI[sel].giorni : null);
  ov.innerHTML = `<div class="scrim" id="scrim"></div>
  <aside class="drawer" role="dialog" aria-label="Esito della chiamata">
    <div class="drawer-h"><div><h2>Com'è andata?</h2><p class="note">${esc(a.nome)}</p></div><button class="x" type="button" id="close" aria-label="Chiudi">✕</button></div>
    <div class="drawer-b">

/* ---------- vista: esiti e misura ---------- */
function vMisura(){
  const d = dentro();
  const lavorate = d.filter(a => S.esiti[a.id]?.length);
  const chiamate = d.reduce((n,a) => n + (S.esiti[a.id]?.length||0), 0);
  const raggiunte = lavorate.filter(a => S.esiti[a.id].some(x => !["no_risposta","sbagliato"].includes(x.e))).length;
  const demo = lavorate.filter(a => S.esiti[a.id].some(x => x.e==="demo")).length;
  const conv = lavorate.length ? demo/lavorate.length*100 : 0;
  const perF = ["A","B","C"].map(f => {
    const g = d.filter(a => fascia(a)===f), l = g.filter(a => S.esiti[a.id]?.length), dm = l.filter(a => S.esiti[a.id].some(x=>x.e==="demo")).length;
    return {f, tot:g.length, l:l.length, dm, pct: l.length ? dm/l.length*100 : null};
  });
  const motivi = ["gestionale","non_interessato","non_richiamare","sbagliato"].map(k => ({k, n: lavorate.filter(a => ultimo(a.id).e===k).length}));
  const maxM = Math.max(1, ...motivi.map(m=>m.n));
  const vuoto = !lavorate.length;
  const pct = v => v==null ? "—" : v.toLocaleString("it-IT",{maximumFractionDigits:1})+"%";
  $("#view").innerHTML = `
    <div class="head"><div class="intro"><h1>Esiti e misura</h1>
      <p>Il test che decide se il segnale funziona: stessi BDR e stessa sequenza, metà lead dal segnale e metà dalle liste comprate. Il numero da battere è il 6% di lead che diventano SQL con le liste di oggi.</p></div>
      <div class="chips">${vuoto?`<button class="btn" type="button" id="sim">Mostra un esempio simulato</button>`:`<button class="btn" type="button" id="reset">Cancella gli esiti</button>`}</div></div>
    ${S.simulato && !vuoto ? `<div class="banner"><span><b>Esempio simulato.</b> Esiti generati a caso per mostrare la pagina: non sono chiamate vere.</span></div>`:""}
    ${vuoto ? `<div class="panel"><div class="empty"><h3>Ancora nessuna chiamata</h3><p>Questa pagina si riempie con gli esiti che salvi dalle schede. Fai qualche chiamata simulata, oppure guarda un esempio.</p></div></div>` : `
    <div class="kpis">
      <div class="kpi"><span class="label">Aziende lavorate</span><b>${lavorate.length}</b><span class="num">${chiamate} chiamate in tutto</span></div>
      <div class="kpi"><span class="label">Titolari raggiunti</span><b>${raggiunte}</b><span>${pct(lavorate.length?raggiunte/lavorate.length*100:null)} delle aziende</span></div>
      <div class="kpi"><span class="label">Demo fissate (SQL)</span><b>${demo}</b><span>passano all'AE</span></div>
      <div class="kpi"><span class="label">Lead → SQL</span><b style="color:${conv>6?"var(--ok-ink)":"var(--fg)"}">${pct(conv)}</b><span>liste comprate: 6%</span></div>
    </div>
    <div class="grid2">
      <div class="panel"><div class="panel-h"><h2>Conversione per fascia</h2><span class="note">se la A non batte la C, si rivedono i pesi</span></div>
        <div class="tablewrap"><table><thead><tr><th>Fascia</th><th>Aziende</th><th>Lavorate</th><th>Demo</th><th>Lead → SQL</th></tr></thead>
        <tbody>${perF.map(r=>`<tr><td><span class="fascia ${r.f}">${r.f}</span></td><td>${r.tot}</td><td>${r.l}</td><td>${r.dm}</td><td><b>${pct(r.pct)}</b></td></tr>`).join("")}
        <tr><td class="muted">Liste comprate</td><td class="muted">—</td><td class="muted">—</td><td class="muted">—</td><td class="muted">6%</td></tr></tbody></table></div></div>
      <div class="panel"><div class="panel-h"><h2>Perché dicono di no</h2></div>
        <div class="panel-b bars">${motivi.map(m=>`<div><div class="bar-l"><span>${ESITI[m.k].t}</span><span class="num">${m.n}</span></div><div class="bar ink"><i style="width:${m.n/maxM*100}%"></i></div></div>`).join("")}
        <p class="note">"Ha già un gestionale" dice quali concorrenti incontra il team: è un dato per il prodotto, non solo per le vendite.</p></div></div>
    </div>`}
    <div class="panel"><div class="panel-h"><h2>Quanto manca per una risposta affidabile</h2><span class="note">360 lead per gruppo per vedere 6% → 12% (confidenza 95%, potenza 80%)</span></div>
      <div class="panel-b bars"><div><div class="bar-l"><span>Lead da segnale lavorati</span><span class="num">${lavorate.length} / 360</span></div><div class="bar"><i style="width:${Math.min(100,lavorate.length/360*100)}%"></i></div></div>
      <p class="note">Al volume del campione (circa 70 lead in target al mese) servono circa 5 mesi. Con appalti ANAC e tutte le province, meno.</p></div></div>`;
  $("#sim")?.addEventListener("click", simula);
  $("#reset")?.addEventListener("click", () => { S.esiti={}; S.simulato=false; save(); route(); });
}
function simula(){
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const pDemo = {A:.2, B:.12, C:.06};
  const now = Date.now();
  dentro().forEach(a => {
    const f = fascia(a), l = [];
    let t = now - 20*864e5 - rnd()*6*864e5;
    if (rnd() < .45) { l.push({t, e:"no_risposta", giorni:2, n:""}); t += 2*864e5; }
    const r = rnd();
    const e = r < pDemo[f] ? "demo" : r < pDemo[f]+.22 ? "gestionale" : r < pDemo[f]+.47 ? "non_interessato" : r < pDemo[f]+.55 ? "sbagliato" : r < pDemo[f]+.6 ? "non_richiamare" : "richiama";
    l.push({t, e, giorni:ESITI[e].giorni, n:"esempio simulato"});
    S.esiti[a.id] = l;
  });
  S.simulato = true; save(); route();
}
